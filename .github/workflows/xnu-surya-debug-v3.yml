name: xnu-surya-debug-v3

on:
  workflow_dispatch:

jobs:
  build:
    name: Build xnu kernel for SURYA (debug v3)
    runs-on: macos-14
    timeout-minutes: 120
    env:
      MACHINE_CONFIG: SURYA
      KERNEL_CONFIG: DEVELOPMENT
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh
          echo "=== build.sh first 20 lines ==="
          head -20 dxb/build.sh

      - name: Deps
        run: |
          brew install jq bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Copy ALL patches
        run: |
          mkdir -p dxb/patches
          cp xnu/patches/*.patch dxb/patches/
          cp xnu/patches/*.sh dxb/patches/ 2>/dev/null || true
          echo "Patches:"
          ls dxb/patches/

      - name: Build kernel (verbose)
        working-directory: dxb
        env:
          MAKEFLAGS: -k
        run: |
          echo "=== Starting build.sh ==="
          echo "MACHINE_CONFIG=$MACHINE_CONFIG"
          echo "KERNEL_CONFIG=$KERNEL_CONFIG"
          bash -x build.sh 2>&1 | tee build.log || true
          echo "=== Build completed ==="
          echo "=== Files in dxb ==="
          find . -maxdepth 3 -name "kernel*" -type f 2>/dev/null || echo "No kernels found"

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log-surya-v3
          path: dxb/build.log

      - name: Find kernel
        if: always()
        run: |
          find dxb -name "kernel*" -type f 2>/dev/null || echo "No kernel files found anywhere"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-surya-v3
          path: |
            dxb/fakeroot/System/Library/Kernels/kernel.*
            dxb/**/kernel*
          if-no-files-found: warn