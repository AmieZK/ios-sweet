name: xnu-surya-working

on:
  workflow_dispatch:

jobs:
  build:
    name: Build xnu kernel for SURYA
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch darwin-xnu-build
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 https://github.com/blacktop/darwin-xnu-build 663906528d1cd5ea8fde7de6f16de73db9511549
          git -C dxb checkout -q FETCH_HEAD
          sed -i '' 's/ARCHS="x86_64 arm64e" VALID_ARCHS="x86_64 arm64e"/ARCHS="x86_64 arm64e arm64" VALID_ARCHS="x86_64 arm64e arm64"/' dxb/build.sh

      - name: Deps
        run: |
          brew install jq bash cmake ninja
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Copy sweet patches first (0001-0081)
        run: |
          mkdir -p dxb/patches
          for f in xnu/patches/*.patch; do
            base=$(basename "$f")
            num=${base%%-*}
            n=${num#0}
            if [[ "$n" =~ ^[0-9]+$ ]] && (( n >= 1 && n <= 81 )); then
              cp "$f" dxb/patches/
            fi
          done
          for f in xnu/patches/*.sh; do
            cp "$f" dxb/patches/ 2>/dev/null || true
          done
          echo "Sweet patches:"
          ls dxb/patches/*.patch 2>/dev/null | wc -l

      - name: Apply sweet patches
        working-directory: dxb
        run: |
          for patch in patches/*.patch; do
            echo "Applying $patch"
            git apply --whitespace=nowarn "$patch" || { echo "FAILED: $patch"; exit 1; }
          done

      - name: Copy SURYA patches (0082-0090 range to avoid conflicts)
        run: |
          for f in xnu/patches/000*-surya-*.patch; do
            base=$(basename "$f")
            # Rename to 0082+ range
            newname="008${base:3}"
            cp "$f" "dxb/patches/$newname"
          done
          echo "SURYA patches:"
          ls dxb/patches/*.patch 2>/dev/null | grep surya || true

      - name: Apply SURYA patches
        working-directory: dxb
        run: |
          for patch in patches/*.patch; do
            echo "Applying $patch"
            git apply --whitespace=nowarn "$patch" || { echo "FAILED: $patch"; exit 1; }
          done

      - name: Build kernel (verbose)
        working-directory: dxb
        env:
          MACHINE_CONFIG: SURYA
          KERNEL_CONFIG: DEVELOPMENT
          MAKEFLAGS: -k
        run: bash build.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-surya
          path: dxb/build.log

      - name: Collect kernel
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel-surya
          path: out/
          if-no-files-found: warn